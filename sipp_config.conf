########################################
#  SIPp Test Configuration
#  Edit this file, then run: bash sipp_manager.sh
#
#  Topology (each SIPp server has TWO interfaces):
#                       Internal LAN     Isolated WAN
#    CALLER  scripts:   172.19.112.50    192.168.1.8
#    CALLED  scripts:   172.19.112.60    192.168.1.7
#    Server3 (spare):   172.19.112.65    192.168.1.17
########################################

# ---- Network selection (drives which IP set is used) ----
#   LAN = Internal LAN (172.19.112.x)   - reach OXE at OXE_IP_LAN
#   WAN = Isolated WAN (192.168.1.x)    - reach OXE at OXE_IP_WAN
# CSV files are suffixed _LAN / _WAN so both sets can coexist on disk.
NETWORK=LAN

# ---- OXE (Target PBX) ----
OXE_IP_LAN=172.19.112.51
OXE_IP_WAN=192.168.1.51
OXE_PORT=5060

# ---- CALLER SIPp Server ----
CALLER_IP_LAN=172.19.112.50
CALLER_IP_WAN=192.168.1.8
CALLER_RANGE_START=55001
CALLER_RANGE_END=55010
CALLER_REG_PORT=5060
CALLER_CALL_PORT=5065

# ---- CALLED SIPp Server ----
CALLED_IP_LAN=172.19.112.60
CALLED_IP_WAN=192.168.1.7
CALLED_RANGE_START=55011
CALLED_RANGE_END=55020
CALLED_REG_PORT=5060
CALLED_CALL_PORT=5060

# ---- Server3 (informational - not driven by the manager today) ----
SERVER3_IP_LAN=172.19.112.65
SERVER3_IP_WAN=192.168.1.17

# ---- Test Parameters ----
REG_COUNT=20
REG_RATE=5
CALL_COUNT=100
CALL_RATE=2

# ---- Transport ----
#   u1 = UDP one-socket-per-call (default)
#   un = UDP single socket
#   t1 = TCP one-socket-per-call
#   tn = TCP single socket
#   l1 = TLS one-socket-per-call
# XMLs use [transport] so Via/Contact follow this value automatically.
TRANSPORT=u1

# ---- Debug traces (1 = enable) ----
# Adds: -trace_msg -trace_err -trace_calldebug -trace_logs -nd
DEBUG_TRACE=0

# ---- PUBLISH VoIP metrics after BYE (1 = enable) ----
# When 1, the CALLER-side scenario is INVITE_Caller_publish.xml which sends
# a PUBLISH (vq-rtcpxr, MOS 4.2) targeting OXE after the BYE. Used to exercise
# the OXE VoIP Metrics Collector feature. When 0, plain INVITE_Caller.xml
# is used (INVITE -> ACK -> BYE, no PUBLISH).
PUBLISH_ENABLED=0

# ---- OXE Management (user create/delete from SIPp) ----
#   OXE_ACCESS: ssh or telnet (how to reach the OXE node)
#   OXE_MTCL_USER/PASSWORD: mtcl login for running mgr commands
#   OXE_ROOT_PASSWORD: root login for deploying scripts (chmod +x)
#   OXE_SCRIPT_PATH: where scripts land on OXE
#   BATCH_SIZE: users per mgr batch (avoids MAO overload)
#   BATCH_PAUSE: seconds to wait between batches
OXE_ACCESS=telnet
OXE_MTCL_USER=mtcl
OXE_MTCL_PASSWORD=mtcl
OXE_ROOT_PASSWORD=mtcl
OXE_SCRIPT_PATH=/tmpd/sipp_tools
BATCH_SIZE=20
BATCH_PAUSE=10
